<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriDesk — Авторизация</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-section">
        <section class="auth-card">
            <div class="logo-big">NutriDesk</div>
            <h1>Авторизация</h1>
            <p class="subtitle">Для входа необходимо ввести адрес email и пароль.</p>

            <div class="input-group">
                <input type="email" placeholder="Email" value="lev1991@gmail.com">
            </div>

            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" placeholder="Пароль" value="1234">
                    <button class="toggle-password" type="button"><i class="far fa-eye"></i></button>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#">Забыли пароль?</a>
            </div>

            <button class="btn-primary" type="button"><a href="home.html">Войти</a></button>

            <p class="register-link">
                Ещё не зарегистрированы? <a href="#">Зарегистрироваться!</a>
            </p>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
